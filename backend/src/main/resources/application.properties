# Same Aiven MySQL database used by the desktop Madam POS.
# Values are required environment variables; never commit database credentials.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Never rewrite the desktop POS tables.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jackson.time-zone=${POS_TIME_ZONE:Asia/Manila}
pos.api.key=${POS_API_KEY}
server.port=${PORT:8080}
